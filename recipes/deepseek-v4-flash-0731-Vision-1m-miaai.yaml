# Recipe: DeepSeek V4 Flash 0731 — MiaAI-Lab 1M migration
#
# Migration of the MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark deployment
# (1M-token context, seqs=8, gpu 0.85, DSpark k=5, thinking=max) onto the
# eugr B12X serving stack.
#
# NOTE: the MiaAI recipe serves --kv-cache-dtype nvfp4_ds_mla, but the eugr
# B12X vLLM REJECTS nvfp4 KV for MLA models ("nvfp4 KV cache is not supported
# with MLA backends") — verified live 2026-08-24. Use fp8 here; if the KV
# pool cannot hold 1M context, lower max_model_len (or raise
# gpu_memory_utilization).
#
# VISION (updated after MiaAI PR #164 feat/vision-exp):
# - Serves deepseek-ai/DeepSeek-V4-Flash-Vision-Exp natively (images via
#   OpenAI image_url; user messages only; NO video — GIF is a still frame).
# - Native image support requires mods/deepseek-v4-vision-exp (fail-closed
#   startup hotfix porting the upstream ViT/Aligner + processor patches onto
#   the B12X stack). Without the mod the server cannot accept images.
# - Vision-Exp has num_nextn_predict_layers=3, so DSpark k must be >=
#   dspark_block_size 5 AND divisible by 3: num_speculative_tokens=6 (k=5
#   is rejected at boot; 0731 tolerated it with n_predict=1).
# - KV pool at util 0.86 was 10.36 GiB — just under the 11.04 GiB needed
#   for 1M tokens (verified live 2026-08-31); gpu_memory_utilization is
#   raised to 0.88 (~12.9 GiB, ~1.09M tokens). If cudagraph capture OOMs,
#   lower max_model_len instead.
# - Upstream pins revision 86f746b36186f0e567729a5c06a8c918caba82a9.
# - B12X mHC is DISABLED for this model: the fused Gram kernel rejects the
#   Vision-Exp decoder shape ("b12x_mhc_pre is served only by the fused
#   Gram kernel ... got hidden_size=4096, split_k=64" — verified live
#   2026-08-31). 0731 keeps VLLM_USE_B12X_MHC=1.

recipe_version: "1"
name: DeepSeek-V4-Flash-Vision-Exp (MiaAI 1M)
description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-Vision-Exp with native images on dual Sparks (MiaAI 1M migration)
model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/deepseek-v4-vision-exp
  - mods/instanttensor-hybrid-draft-loader
  - mods/suppress-stops-in-reasoning
  - mods/assistant-final-continuation
  - mods/tool-call-truncation
  - mods/drop-caches

defaults:
  port: 8081
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.88
  max_model_len: 1048576
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 6

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MOE_SKIP_PADDING: "1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  # Vision-Exp decoder shape (hidden 4096 / hc_mult 4 → split_k 64) is
  # rejected by the b12x mHC fused Gram kernel; keep mHC off here.
  VLLM_USE_B12X_MHC: "0"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --limit-mm-per-prompt '{{"image":8}}' \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=max \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
